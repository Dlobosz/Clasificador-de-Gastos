spring.application.name=Clasificador-gastos

# Los defaults (localhost:3306, clasificador_gastos, root) son los que
# usamos en desarrollo con el contenedor mysql-gastos. En Railway estas
# variables se pisan con las del plugin de MySQL (DB_HOST, DB_PORT,
# DB_NAME, DB_USER, DB_PASSWORD) sin tocar este archivo.
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:clasificador_gastos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}

# Railway asigna el puerto dinamicamente via la variable PORT; en local
# no existe esa variable, asi que cae al 8080 de siempre.
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

groq.api.url=https://api.groq.com/openai/v1/chat/completions
groq.api.model=llama-3.1-8b-instant
groq.api.key=${GROQ_API_KEY}